name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Run Tests with Code Coverage
        run: swift test --enable-code-coverage --xunit-output test-results.xml

      - name: Export Coverage as LCOV
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          # The test bundle name differs between SwiftPM build systems, so locate it instead of hardcoding it.
          TEST_BUNDLE="$(find "$BIN_PATH" -maxdepth 1 -name '*.xctest' | head -n 1)"
          TEST_BINARY="$(find "$TEST_BUNDLE/Contents/MacOS" -type f -perm +111 | head -n 1)"
          mkdir -p coverage
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex='\.build|Tests' \
            "$TEST_BINARY" > coverage/lcov.info

      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage/lcov.info

      - name: Upload Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          slug: ${{ github.repository }}
          files: ./test-results*.xml
